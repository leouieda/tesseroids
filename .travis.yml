language: c
compiler: gcc
env:
  - PATH=$TRAVIS_BUILD_DIR/bin:$PATH MPLCONFIGDIR=$TRAVIS_BUILD_DIR
install:
  - sudo apt-get update -qq
  - sudo apt-get install -qq python-matplotlib python-numpy python-mpltoolkits.basemap
  # For cross-compiling 32bit binaries (mode=bin32) and win32 (mode=win32)
  - sudo apt-get install -qq libc6-dev-i386
  - sudo apt-get install -qq mingw32
  - sudo apt-get install -qq wine
  # To set the matplotlib rc file
  - bash .travis.sh
script:
  - scons mode=check
  - scons -c; scons mode=default
  - ./tesstest
  - cd cookbook; make all; cd $TRAVIS_BUILD_DIR
  - scons -c; scons mode=bin32
  - ./tesstest
  - cd cookbook; make all; cd $TRAVIS_BUILD_DIR
  - scons -c; scons mode=win32
  - wine tesstest.exe
  - scons mode=default; cd bench; make; cd $TRAVIS_BUILD_DIR
notifications:
  email: false
